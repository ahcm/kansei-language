[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-kansei"
description = "Kansei language"
version = "0.0.1"
keywords = ["incremental", "parsing", "tree-sitter", "kansei"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Andreas Hauser", email = "andreas@creative-memory.net" }]
requires-python = ">=3.10"
license.text = "EUPL"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/ahcm/kansei-language"
Funding = "https://creative-memory.ai/"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
